version: 2

models:
  - name: dim_customers
    description: Current customer dimension used by application and payment facts.
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]

  - name: fct_applications
    description: Application fact at one row per application.
    columns:
      - name: application_id
        tests: [not_null, unique]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key

  - name: fct_payments
    description: Payment fact at one row per payment transaction.
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: application_id
        tests:
          - relationships:
              to: ref('fct_applications')
              field: application_id

  - name: application_payment_summary
    description: Gold model combining application, customer and completed-payment measures.
    columns:
      - name: application_id
        tests: [not_null, unique]
      - name: remaining_amount
        tests:
          - dbt_utils.expression_is_true:
              expression: '>= 0'

