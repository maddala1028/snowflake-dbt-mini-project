name: dbt CD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dbt-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dbt to production
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_PROD_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps --profiles-dir .github/dbt

      - name: Validate production connection
        run: dbt debug --target prod --profiles-dir .github/dbt

      - name: Deploy production models
        run: dbt run --target prod --profiles-dir .github/dbt

      - name: Test production deployment
        run: dbt test --target prod --profiles-dir .github/dbt

      - name: Generate documentation artifacts
        run: dbt docs generate --target prod --profiles-dir .github/dbt

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-production-artifacts-${{ github.run_id }}
          path: target/
          if-no-files-found: warn
          retention-days: 14