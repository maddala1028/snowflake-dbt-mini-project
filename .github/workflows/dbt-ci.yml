name: dbt CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serial execution protects the shared CI schemas.
concurrency:
  group: dbt-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test dbt project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps --profiles-dir .github/dbt

      - name: Validate Snowflake connection
        run: dbt debug --target ci --profiles-dir .github/dbt

      - name: Bootstrap isolated CI schemas
        run: dbt run --full-refresh --target ci --profiles-dir .github/dbt
      - name: Build and test isolated CI schemas
        run: dbt build --full-refresh --target ci --profiles-dir .github/dbt

      - name: Generate dbt documentation artifacts
        run: dbt docs generate --target ci --profiles-dir .github/dbt

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts-${{ github.run_id }}
          path: |
            target/manifest.json
            target/catalog.json
            target/run_results.json
          if-no-files-found: error
          retention-days: 7